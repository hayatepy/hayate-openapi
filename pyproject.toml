[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[project]
name = "hayate-openapi"
version = "0.8.1"
description = "OpenAPI 3.1 generation for hayate: routes from app.routes, schemas from your validators"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuke Hayashi" }]
keywords = ["hayate", "openapi", "json-schema", "documentation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Documentation",
]
dependencies = [
  "hayate>=0.13.0",
  "jsonschema>=4.25,<5",
]

[project.optional-dependencies]
msgspec = ["msgspec>=0.18"]
pydantic = ["pydantic>=2.9"]

[project.urls]
Repository = "https://github.com/hayatepy/hayate-openapi"
Documentation = "https://github.com/hayatepy/hayate-openapi#readme"
Changelog = "https://github.com/hayatepy/hayate-openapi/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "types-jsonschema>=4.25",
  "msgspec>=0.18",
  "pydantic>=2.9",
  "openapi-spec-validator>=0.7",
  "uvicorn==0.52.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
